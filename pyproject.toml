[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-earth-client"
version = "0.2.0.dev0"
description = "Python client for the Gamma Earth S2DR3 API: submit a job, follow its STAC collection, download the products."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "pystac>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
